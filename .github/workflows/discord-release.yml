# ---------- Announce a new release on Discord ----------
name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    if: github.repository == 'Hoyle95/couchwave'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::The DISCORD_WEBHOOK secret isn't set: add it in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          if [ -z "$URL" ]; then
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq '[.[] | select(.draft | not)][0]')
            NAME=$(jq -r '.name // ""' <<<"$release"); TAG=$(jq -r '.tag_name' <<<"$release"); URL=$(jq -r '.html_url' <<<"$release")
          fi
          message="New Couchwave release out now! **${NAME:-$TAG}**"$'\n'"$URL"
          jq -n --arg content "$message" '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail-with-body -sS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
          echo "Announced: ${NAME:-$TAG} ($URL)"
